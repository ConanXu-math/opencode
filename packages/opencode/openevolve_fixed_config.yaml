# OpenEvolve 永久配置 - DeepSeek
llm:
  models:
    - name: "deepseek-chat"
      api_key: "sk-968853b16b864c3681edbfe5ff4675ae"
      api_base: "https://api.deepseek.com/v1"
      temperature: 0.7
      max_tokens: 4000
  api_base: "https://api.deepseek.com/v1"
  temperature: 0.7
  max_tokens: 4000

evolution:
  population_size: 50
  num_islands: 3
